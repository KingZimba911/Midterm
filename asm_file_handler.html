<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASM File Handler v1.0 — x86 DOS Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050f05;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px 12px;
  }

  #asm-root {
    font-family: 'Share Tech Mono', monospace;
    background: #0a0f0a;
    color: #00e040;
    width: 100%;
    max-width: 860px;
    border-radius: 10px;
    border: 1px solid #1a3a1a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Title Bar ── */
  #title-bar {
    background: #0d1a0d;
    border-bottom: 1px solid #1e3e1e;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #33ff66;
    letter-spacing: 1px;
  }
  #title-bar .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #title-bar .d1 { background: #ff5f56; }
  #title-bar .d2 { background: #ffbd2e; }
  #title-bar .d3 { background: #27c93f; }
  #title-bar .spacer { margin-left: auto; font-size: 13px; color: #1a7a2a; letter-spacing: 2px; }

  /* ── Register Bar ── */
  #reg-bar {
    background: #030803;
    border-bottom: 1px solid #0e2e0e;
    padding: 4px 14px;
    display: flex;
    gap: 18px;
    font-size: 11px;
    color: #2a8a3a;
    overflow-x: auto;
    white-space: nowrap;
  }
  .reg { color: #00cc44; }
  .reg b { color: #33ff66; margin-right: 3px; }

  /* ── Output Screen ── */
  #screen {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 4px;
    font-size: 13px;
    line-height: 1.65;
    min-height: 360px;
    max-height: 440px;
    scrollbar-width: thin;
    scrollbar-color: #1a4a1a #0a0f0a;
  }
  #screen::-webkit-scrollbar { width: 5px; }
  #screen::-webkit-scrollbar-track { background: #0a0f0a; }
  #screen::-webkit-scrollbar-thumb { background: #1a4a1a; border-radius: 2px; }

  .line { white-space: pre-wrap; word-break: break-all; }
  .line.prompt { color: #00e040; }
  .line.cmd    { color: #66ffaa; }
  .line.out    { color: #44bb66; }
  .line.err    { color: #ff4040; }
  .line.info   { color: #88ddaa; }
  .line.head   { color: #33ff66; font-family: 'VT323', monospace; font-size: 16px; }
  .line.asm    { color: #55bb88; font-size: 11px; }
  .line.dim    { color: #1a6a2a; }

  /* ── Assembly Panel ── */
  #asm-panel {
    background: #020702;
    border-top: 1px solid #0a2a0a;
    padding: 6px 14px;
    font-size: 11px;
    color: #1a6a2a;
    min-height: 56px;
    max-height: 84px;
    overflow-y: auto;
  }
  #asm-panel .asm-line        { color: #2a7a3a; font-family: 'Share Tech Mono', monospace; }
  #asm-panel .asm-line.active { color: #44cc66; }
  #asm-panel .asm-line b      { color: #22aa44; }

  /* ── Input Row ── */
  #input-row {
    background: #030b03;
    border-top: 1px solid #0e2e0e;
    display: flex;
    align-items: center;
    padding: 7px 14px;
    gap: 8px;
  }
  #prompt-label {
    color: #33ff66;
    font-size: 13px;
    white-space: nowrap;
  }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #88ffaa;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    caret-color: #00ff44;
  }
  #cmd-input::placeholder { color: #1a4a1a; }

  #run-btn {
    background: #0a2a0a;
    border: 1px solid #1a5a1a;
    color: #33ff66;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s;
  }
  #run-btn:hover  { background: #0e3e0e; border-color: #2a8a2a; }
  #run-btn:active { transform: scale(0.97); }

  /* ── Hint Bar ── */
  #hint-bar {
    padding: 4px 14px;
    background: #030803;
    border-top: 1px solid #071507;
    font-size: 10px;
    color: #1a5a1a;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .hint   { color: #2a7a3a; }
  .hint b { color: #44aa55; }

  /* Blinking cursor */
  #cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: #00ff44;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="asm-root">

  <!-- Title Bar -->
  <div id="title-bar">
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    ASM FILE HANDLER v1.0 — x86 DOS SIMULATOR
    <span class="spacer">INT 21h</span>
  </div>

  <!-- CPU Register Bar -->
  <div id="reg-bar">
    <span class="reg"><b>AX:</b><span id="r-ax">0000</span></span>
    <span class="reg"><b>BX:</b><span id="r-bx">0000</span></span>
    <span class="reg"><b>CX:</b><span id="r-cx">0000</span></span>
    <span class="reg"><b>DX:</b><span id="r-dx">0000</span></span>
    <span class="reg"><b>SI:</b><span id="r-si">0000</span></span>
    <span class="reg"><b>DI:</b><span id="r-di">0000</span></span>
    <span class="reg"><b>SP:</b><span id="r-sp">FFFF</span></span>
    <span class="reg"><b>CS:</b><span id="r-cs">0000</span></span>
    <span class="reg"><b>DS:</b><span id="r-ds">0000</span></span>
    <span class="reg"><b>CF:</b><span id="r-cf">0</span></span>
    <span class="reg"><b>ZF:</b><span id="r-zf">0</span></span>
  </div>

  <!-- Terminal Output -->
  <div id="screen"></div>

  <!-- Assembly Instruction Panel -->
  <div id="asm-panel">
    <span class="asm-line dim">; Assembly output will appear here...</span>
  </div>

  <!-- Command Input -->
  <div id="input-row">
    <span id="prompt-label">C:\ASM&gt;</span>
    <input id="cmd-input" type="text"
           placeholder="type a command (HELP for list)"
           autocomplete="off" spellcheck="false" />
    <button id="run-btn">EXEC</button>
  </div>

  <!-- Quick Hint Bar -->
  <div id="hint-bar">
    <span class="hint"><b>HELP</b> — all cmds</span>
    <span class="hint"><b>DIR</b> — list files</span>
    <span class="hint"><b>TYPE</b> &lt;file&gt;</span>
    <span class="hint"><b>COPY</b> &lt;src&gt; &lt;dst&gt;</span>
    <span class="hint"><b>DEL</b> &lt;file&gt;</span>
    <span class="hint"><b>MKDIR</b> &lt;dir&gt;</span>
    <span class="hint"><b>EDIT</b> &lt;file&gt; &lt;text&gt;</span>
  </div>

</div>

<script>
(function () {

  /* ── DOM refs ── */
  const screen     = document.getElementById('screen');
  const input      = document.getElementById('cmd-input');
  const runBtn     = document.getElementById('run-btn');
  const asmPanel   = document.getElementById('asm-panel');
  const promptLabel= document.getElementById('prompt-label');

  /* ── State ── */
  let currentDir = 'C:\\';
  let history    = [];
  let histIdx    = -1;

  /* ── CPU Registers ── */
  let regs = {
    AX:'0000', BX:'0000', CX:'0000', DX:'0000',
    SI:'0000', DI:'0000', SP:'FFFF',
    CS:'0000', DS:'0000', CF:0, ZF:0
  };

  function updateRegs(updates) {
    Object.assign(regs, updates);
    for (let k in updates) {
      const el = document.getElementById('r-' + k.toLowerCase());
      if (el) el.textContent = updates[k];
    }
  }

  function toHex(n, w = 4) {
    return n.toString(16).toUpperCase().padStart(w, '0');
  }

  /* ── Virtual Filesystem ── */
  const fs = {
    'C:\\'         : { type:'dir', children:['C:\\SYSTEM','C:\\DOCS','C:\\ASM'] },
    'C:\\SYSTEM'   : { type:'dir', children:['C:\\SYSTEM\\CONFIG.SYS','C:\\SYSTEM\\AUTOEXEC.BAT'] },
    'C:\\DOCS'     : { type:'dir', children:['C:\\DOCS\\README.TXT','C:\\DOCS\\NOTES.TXT'] },
    'C:\\ASM'      : { type:'dir', children:['C:\\ASM\\MAIN.ASM','C:\\ASM\\UTIL.ASM'] },

    'C:\\SYSTEM\\CONFIG.SYS': {
      type:'file',
      content:'DEVICE=HIMEM.SYS\nBUFFERS=20\nFILES=40\nDOS=HIGH,UMB',
      size:52, date:'01-15-2024'
    },
    'C:\\SYSTEM\\AUTOEXEC.BAT': {
      type:'file',
      content:'@ECHO OFF\nPATH C:\\;C:\\DOS;C:\\UTIL\nPROMPT $P$G\nSET TEMP=C:\\TEMP',
      size:61, date:'01-15-2024'
    },
    'C:\\DOCS\\README.TXT': {
      type:'file',
      content:'ASM FILE HANDLER v1.0\n======================\nA DOS-style file manager\nwritten in x86 Assembly.\n\nSupports 20 commands.\nType HELP for a full list.',
      size:98, date:'04-01-2024'
    },
    'C:\\DOCS\\NOTES.TXT': {
      type:'file',
      content:'Assembly language notes:\n- INT 21h: DOS services\n- AH=3Ch: Create file\n- AH=3Dh: Open file\n- AH=3Fh: Read file\n- AH=40h: Write file\n- AH=3Eh: Close file',
      size:124, date:'04-10-2024'
    },
    'C:\\ASM\\MAIN.ASM': {
      type:'file',
      content:'.MODEL SMALL\n.STACK 100h\n.DATA\n  msg DB "Hello$"\n.CODE\nMAIN PROC\n  MOV AX, @DATA\n  MOV DS, AX\n  MOV AH, 09h\n  LEA DX, msg\n  INT 21h\n  MOV AH, 4Ch\n  INT 21h\nMAIN ENDP\nEND MAIN',
      size:163, date:'04-20-2024'
    },
    'C:\\ASM\\UTIL.ASM': {
      type:'file',
      content:'; Utility routines\nPRINT_STR PROC\n  MOV AH, 09h\n  INT 21h\n  RET\nPRINT_STR ENDP',
      size:88, date:'04-20-2024'
    },
  };

  /* ── Helpers ── */
  function resolvePath(p) {
    if (!p) return currentDir;
    p = p.toUpperCase().trim();
    if (p === '..') {
      if (currentDir === 'C:\\') return 'C:\\';
      const parts = currentDir.split('\\').filter(Boolean);
      parts.pop();
      return parts.length <= 1 ? 'C:\\' : parts.join('\\');
    }
    if (p.startsWith('C:\\')) return p;
    if (currentDir === 'C:\\') return 'C:\\' + p;
    return currentDir + '\\' + p;
  }

  function getEntry(path) {
    return fs[path.toUpperCase().trim()] || null;
  }

  function print(text, cls = 'out') {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = text;
    screen.appendChild(d);
    screen.scrollTop = screen.scrollHeight;
  }

  function printASM(lines) {
    asmPanel.innerHTML = '';
    lines.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'asm-line' + (i === lines.length - 1 ? ' active' : '');
      d.textContent = l;
      asmPanel.appendChild(d);
    });
  }

  function setFlag(cf, zf) {
    updateRegs({ CF: cf, ZF: zf });
  }

  /* ═══════════════════════════════════════════════
     20 COMMANDS
  ═══════════════════════════════════════════════ */
  const COMMANDS = {

    /* 1. HELP — list all commands */
    HELP: () => {
      printASM([
        '; AH=00h: Terminate / display help',
        'MOV AH, 00h',
        'INT 21h    ; Custom: list commands',
        'INT 20h'
      ]);
      updateRegs({ AX:'0000', BX:'0000' });
      setFlag(0, 1);

      print('┌─────────────────────────────────────────────────────────┐','head');
      print('│           ASM FILE HANDLER — 20 COMMANDS                │','head');
      print('├──────────────────┬──────────────────────────────────────┤','head');
      const cmds = [
        ['DIR [path]',        'List directory contents'],
        ['CD <dir>',          'Change directory'],
        ['MKDIR <name>',      'Create new directory'],
        ['RMDIR <name>',      'Remove empty directory'],
        ['TYPE <file>',       'Display file contents'],
        ['COPY <src> <dst>',  'Copy file to destination'],
        ['DEL <file>',        'Delete a file'],
        ['REN <old> <new>',   'Rename file or directory'],
        ['EDIT <file> <txt>', 'Write text to file (create/overwrite)'],
        ['APPEND <f> <txt>',  'Append text to existing file'],
        ['FIND <str> <file>', 'Search string in file'],
        ['ATTR <file>',       'Show file attributes'],
        ['SIZE <file>',       'Show file size in bytes'],
        ['DATE <file>',       'Show file creation date'],
        ['MOVE <src> <dir>',  'Move file into directory'],
        ['TREE [path]',       'Show directory tree'],
        ['CLS',               'Clear the screen'],
        ['PWD',               'Print current directory'],
        ['ECHO <text>',       'Print text to screen'],
        ['HELP',              'Show this help screen'],
      ];
      cmds.forEach(([c, d]) => {
        print('│ ' + c.padEnd(16) + ' │ ' + d.padEnd(38) + ' │', 'info');
      });
      print('└──────────────────┴──────────────────────────────────────┘','head');
    },

    /* 2. DIR — list directory */
    DIR: (args) => {
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=1Ah: Set DTA, AH=4Eh: Find First File',
        'MOV AH, 1Ah',
        'LEA DX, DTA_BUFFER',
        'INT 21h',
        'MOV AH, 4Eh',
        'INT 21h    ; CF=0 found, CF=1 not found'
      ]);
      if (!entry || entry.type !== 'dir') {
        updateRegs({ AX:'0002', CX:'0000' }); setFlag(1, 0);
        print('Error: Path not found — ' + path, 'err'); return;
      }
      updateRegs({ AX:'004E', BX:'0001', DX: toHex(path.length) }); setFlag(0, 0);
      print(' Directory of ' + path, 'info');
      print('', 'out');
      let count = 0, total = 0;
      (entry.children || []).forEach(child => {
        const e    = getEntry(child);
        const name = child.split('\\').pop();
        if (!e) return;
        if (e.type === 'dir') {
          print(' <DIR>       ' + name, 'out');
        } else {
          print(' ' + String(e.size || 0).padStart(8) + '  ' + (e.date || '??-??-????') + '  ' + name, 'out');
          total += e.size || 0;
        }
        count++;
      });
      print('', 'out');
      print('  ' + count + ' file(s)  ' + total + ' bytes', 'dim');
      updateRegs({ CX: toHex(count), SI: toHex(total) });
    },

    /* 3. CD — change directory */
    CD: (args) => {
      if (!args[0]) { print(currentDir, 'out'); return; }
      const path = resolvePath(args[0]);
      printASM([
        '; CD — change working directory (DOS internal)',
        '; MOV AH, 3Bh: Set current directory',
        'MOV AH, 3Bh',
        'LEA DX, PATH_STR',
        'INT 21h'
      ]);
      const entry = getEntry(path);
      if (!entry || entry.type !== 'dir') {
        setFlag(1, 0); updateRegs({ AX:'0003' });
        print('Invalid directory: ' + path, 'err'); return;
      }
      currentDir = path;
      promptLabel.textContent = path + '>';
      setFlag(0, 1); updateRegs({ AX:'003B', DX: toHex(path.length) });
      print('Changed to ' + path, 'info');
    },

    /* 4. MKDIR — create directory */
    MKDIR: (args) => {
      if (!args[0]) { print('Usage: MKDIR <dirname>', 'err'); return; }
      const path = resolvePath(args[0]);
      printASM([
        '; AH=39h: Create Directory (MKDIR)',
        'MOV AH, 39h',
        'LEA DX, DIR_NAME',
        'INT 21h    ; CF set on error'
      ]);
      if (fs[path]) {
        setFlag(1, 0); updateRegs({ AX:'0005' });
        print('Directory already exists: ' + path, 'err'); return;
      }
      const parentEntry = getEntry(currentDir);
      if (!parentEntry || parentEntry.type !== 'dir') {
        setFlag(1, 0); print('Parent path not found', 'err'); return;
      }
      fs[path] = { type:'dir', children:[] };
      if (!parentEntry.children.includes(path)) parentEntry.children.push(path);
      setFlag(0, 1); updateRegs({ AX:'0039', DX: toHex(path.length) });
      print('Directory created: ' + path, 'info');
    },

    /* 5. RMDIR — remove directory */
    RMDIR: (args) => {
      if (!args[0]) { print('Usage: RMDIR <dirname>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=3Ah: Remove Directory (RMDIR)',
        'MOV AH, 3Ah',
        'LEA DX, DIR_NAME',
        'INT 21h    ; CF=1 if not empty or missing'
      ]);
      if (!entry || entry.type !== 'dir') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('Directory not found: ' + path, 'err'); return;
      }
      if ((entry.children || []).length > 0) {
        setFlag(1, 0); updateRegs({ AX:'0010' });
        print('Directory not empty: ' + path, 'err'); return;
      }
      delete fs[path];
      Object.keys(fs).forEach(k => {
        if (fs[k].type === 'dir' && fs[k].children)
          fs[k].children = fs[k].children.filter(c => c !== path);
      });
      setFlag(0, 1); updateRegs({ AX:'003A' });
      print('Removed directory: ' + path, 'info');
    },

    /* 6. TYPE — display file contents */
    TYPE: (args) => {
      if (!args[0]) { print('Usage: TYPE <filename>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=3Dh: Open File, AH=3Fh: Read File',
        'MOV AH, 3Dh',
        'LEA DX, FILENAME',
        'MOV AL, 00h    ; open read-only',
        'INT 21h',
        'MOV BX, AX    ; file handle',
        'MOV AH, 3Fh',
        'MOV CX, 0200h',
        'INT 21h',
        'MOV AH, 3Eh',
        'INT 21h    ; close handle'
      ]);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      const size = (entry.content || '').length;
      updateRegs({ AX:'003F', BX:'0001', CX: toHex(size), DX:'0000' }); setFlag(0, 0);
      print('--- ' + path + ' ---', 'head');
      (entry.content || '').split('\n').forEach(l => print(l, 'out'));
      print('--- EOF (' + size + ' bytes) ---', 'dim');
    },

    /* 7. COPY — copy file */
    COPY: (args) => {
      if (!args[0] || !args[1]) { print('Usage: COPY <src> <dst>', 'err'); return; }
      const src = resolvePath(args[0]), dst = resolvePath(args[1]);
      printASM([
        '; COPY: Open src (3Dh), Read (3Fh), Create dst (3Ch), Write (40h), Close (3Eh)',
        'MOV AH, 3Dh  ; open source',
        'INT 21h',
        'MOV BX, AX',
        'MOV AH, 3Fh  ; read into buffer',
        'INT 21h',
        'MOV AH, 3Ch  ; create destination',
        'INT 21h',
        'MOV AH, 40h  ; write buffer',
        'INT 21h',
        'MOV AH, 3Eh  ; close both',
        'INT 21h'
      ]);
      const srcEntry = getEntry(src);
      if (!srcEntry || srcEntry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('Source not found: ' + src, 'err'); return;
      }
      if (fs[dst]) {
        setFlag(1, 0); updateRegs({ AX:'0005' });
        print('Destination already exists: ' + dst, 'err'); return;
      }
      const size = (srcEntry.content || '').length;
      fs[dst] = { type:'file', content: srcEntry.content, size: srcEntry.size, date: srcEntry.date };
      const dstParent = dst.split('\\').slice(0, -1).join('\\') || 'C:\\';
      if (fs[dstParent] && fs[dstParent].children && !fs[dstParent].children.includes(dst))
        fs[dstParent].children.push(dst);
      updateRegs({ AX:'0040', BX:'0002', CX: toHex(size) }); setFlag(0, 0);
      print('Copied ' + src + ' -> ' + dst + ' (' + size + ' bytes)', 'info');
    },

    /* 8. DEL — delete file */
    DEL: (args) => {
      if (!args[0]) { print('Usage: DEL <filename>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=41h: Delete File',
        'MOV AH, 41h',
        'LEA DX, FILENAME',
        'INT 21h    ; CF=1 if not found or read-only'
      ]);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      delete fs[path];
      Object.keys(fs).forEach(k => {
        if (fs[k].children) fs[k].children = fs[k].children.filter(c => c !== path);
      });
      updateRegs({ AX:'0041', BX:'0000' }); setFlag(0, 1);
      print('Deleted: ' + path, 'info');
    },

    /* 9. REN — rename file or directory */
    REN: (args) => {
      if (!args[0] || !args[1]) { print('Usage: REN <old> <new>', 'err'); return; }
      const oldPath = resolvePath(args[0]);
      const newName = args[1].toUpperCase();
      const parts   = oldPath.split('\\');
      parts[parts.length - 1] = newName;
      const newPath = parts.join('\\');
      printASM([
        '; AH=56h: Rename File / Move Entry',
        'MOV AH, 56h',
        'LEA DX, OLD_NAME',
        'LEA DI, NEW_NAME',
        'INT 21h    ; CF=1 on error'
      ]);
      const entry = getEntry(oldPath);
      if (!entry) {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('Not found: ' + oldPath, 'err'); return;
      }
      if (fs[newPath]) {
        setFlag(1, 0); updateRegs({ AX:'0005' });
        print('Target already exists: ' + newPath, 'err'); return;
      }
      fs[newPath] = { ...entry };
      delete fs[oldPath];
      Object.keys(fs).forEach(k => {
        if (fs[k].children)
          fs[k].children = fs[k].children.map(c => c === oldPath ? newPath : c);
      });
      updateRegs({ AX:'0056', DX: toHex(oldPath.length), DI: toHex(newPath.length) }); setFlag(0, 0);
      print('Renamed ' + oldPath + ' -> ' + newPath, 'info');
    },

    /* 10. EDIT — create/overwrite file with text */
    EDIT: (args) => {
      if (!args[0]) { print('Usage: EDIT <file> <text>', 'err'); return; }
      const path = resolvePath(args[0]);
      const text = args.slice(1).join(' ');
      printASM([
        '; AH=3Ch: Create/Truncate File, AH=40h: Write File',
        'MOV AH, 3Ch',
        'LEA DX, FILENAME',
        'MOV CX, 0000h  ; normal attr',
        'INT 21h',
        'MOV BX, AX    ; file handle',
        'MOV AH, 40h',
        'LEA DX, BUFFER',
        'MOV CX, TEXT_LEN',
        'INT 21h',
        'MOV AH, 3Eh',
        'INT 21h'
      ]);
      const size = text.length;
      const now  = new Date();
      const d    = String(now.getMonth()+1).padStart(2,'0') + '-' +
                   String(now.getDate()).padStart(2,'0')    + '-' +
                   now.getFullYear();
      if (!fs[path]) {
        fs[path] = { type:'file', content: text, size, date: d };
        const parent = path.split('\\').slice(0, -1).join('\\') || 'C:\\';
        if (fs[parent] && fs[parent].children && !fs[parent].children.includes(path))
          fs[parent].children.push(path);
        print('Created: ' + path + ' (' + size + ' bytes)', 'info');
      } else {
        fs[path].content = text; fs[path].size = size; fs[path].date = d;
        print('Updated: ' + path + ' (' + size + ' bytes)', 'info');
      }
      updateRegs({ AX:'003C', BX:'0001', CX: toHex(size) }); setFlag(0, size === 0 ? 1 : 0);
    },

    /* 11. APPEND — append text to file */
    APPEND: (args) => {
      if (!args[0]) { print('Usage: APPEND <file> <text>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const text  = args.slice(1).join(' ');
      const entry = getEntry(path);
      printASM([
        '; AH=3Dh: Open, AH=42h: Seek EOF, AH=40h: Write',
        'MOV AH, 3Dh',
        'MOV AL, 01h  ; write mode',
        'INT 21h',
        'MOV BX, AX',
        'MOV AH, 42h  ; lseek',
        'MOV AL, 02h  ; from EOF',
        'XOR CX, CX',
        'XOR DX, DX',
        'INT 21h',
        'MOV AH, 40h',
        'INT 21h',
        'MOV AH, 3Eh',
        'INT 21h'
      ]);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      entry.content += '\n' + text;
      entry.size = (entry.content || '').length;
      updateRegs({ AX:'0042', BX:'0001', CX: toHex(text.length) }); setFlag(0, 0);
      print('Appended ' + text.length + ' bytes to ' + path, 'info');
    },

    /* 12. FIND — search string in file */
    FIND: (args) => {
      if (!args[0] || !args[1]) { print('Usage: FIND <string> <file>', 'err'); return; }
      const searchStr = args[0].toUpperCase();
      const path      = resolvePath(args[1]);
      printASM([
        '; FIND: read file (3Fh), scan buffer for string',
        'MOV AH, 3Dh  ; open',
        'INT 21h',
        'MOV BX, AX',
        'MOV AH, 3Fh  ; read',
        'INT 21h',
        '; scan with SCASB / REPNZ SCASB',
        'REPNZ SCASB  ; scan for byte',
        'MOV AH, 3Eh  ; close',
        'INT 21h'
      ]);
      const entry = getEntry(path);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      const lines = (entry.content || '').split('\n');
      let found = 0;
      lines.forEach((l, i) => {
        if (l.toUpperCase().includes(searchStr)) {
          print('  [Line ' + (i + 1) + ']: ' + l, 'info');
          found++;
        }
      });
      if (found === 0) {
        print('String "' + args[0] + '" not found in ' + path, 'dim');
        setFlag(0, 1); updateRegs({ AX:'0000', ZF:'1' });
      } else {
        print(found + ' match(es) found', 'out');
        setFlag(0, 0); updateRegs({ AX: toHex(found), ZF:'0' });
      }
    },

    /* 13. ATTR — show file attributes */
    ATTR: (args) => {
      if (!args[0]) { print('Usage: ATTR <file>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=43h: Get/Set File Attributes',
        'MOV AH, 43h',
        'MOV AL, 00h  ; GET attributes',
        'LEA DX, FILENAME',
        'INT 21h    ; CX = attribute word'
      ]);
      if (!entry) {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('Not found: ' + path, 'err'); return;
      }
      const attrWord = entry.type === 'dir' ? '0010' : '0020';
      const attrDesc = entry.type === 'dir' ? 'D--- (Directory)' : '---A (Archive)';
      updateRegs({ AX:'0043', CX: attrWord }); setFlag(0, 0);
      print('Attributes of: ' + path, 'info');
      print('  Type     : ' + (entry.type === 'dir' ? 'DIRECTORY' : 'FILE'), 'out');
      print('  Attr Byte: ' + attrWord + 'h  ' + attrDesc, 'out');
      print('  Read-Only: NO   Hidden: NO   System: NO', 'out');
    },

    /* 14. SIZE — show file size */
    SIZE: (args) => {
      if (!args[0]) { print('Usage: SIZE <file>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=3Dh: Open, AH=42h: Seek to get size',
        'MOV AH, 3Dh',
        'MOV AL, 00h',
        'INT 21h',
        'MOV BX, AX',
        'MOV AH, 42h  ; seek',
        'MOV AL, 02h  ; from end',
        'XOR CX, CX',
        'XOR DX, DX',
        'INT 21h    ; DX:AX = file size',
        'MOV AH, 3Eh',
        'INT 21h'
      ]);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      const size = entry.size || 0;
      updateRegs({ AX: toHex(size & 0xFFFF), DX: toHex((size >> 16) & 0xFFFF), CX:'0000' });
      setFlag(0, size === 0 ? 1 : 0);
      print('File: ' + path, 'info');
      print('  Size: ' + size + ' bytes  (' + Math.ceil(size / 512) + ' sector(s))', 'out');
    },

    /* 15. DATE — show file date */
    DATE: (args) => {
      if (!args[0]) { print('Usage: DATE <file>', 'err'); return; }
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; AH=57h: Get/Set File Date & Time',
        'MOV AH, 3Dh',
        'MOV AL, 00h',
        'INT 21h',
        'MOV BX, AX',
        'MOV AH, 57h',
        'MOV AL, 00h  ; GET date/time',
        'INT 21h    ; DX=date word, CX=time word',
        'MOV AH, 3Eh',
        'INT 21h'
      ]);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('File not found: ' + path, 'err'); return;
      }
      updateRegs({ AX:'0057', CX:'0000', DX:'0000' }); setFlag(0, 0);
      print('File: ' + path, 'info');
      print('  Created : ' + (entry.date || 'unknown'), 'out');
      print('  Modified: ' + (entry.date || 'unknown'), 'out');
    },

    /* 16. MOVE — move file into a directory */
    MOVE: (args) => {
      if (!args[0] || !args[1]) { print('Usage: MOVE <src> <dst_dir>', 'err'); return; }
      const src    = resolvePath(args[0]);
      const dstDir = resolvePath(args[1]);
      const name   = src.split('\\').pop();
      const dst    = (dstDir === 'C:\\' ? dstDir : dstDir + '\\') + name;
      printASM([
        '; MOVE: AH=3Dh open, AH=3Fh read, AH=3Ch create dst,',
        'AH=40h write, AH=3Eh close, AH=41h delete src',
        'MOV AH, 56h  ; or use rename across dirs',
        'INT 21h'
      ]);
      const entry    = getEntry(src);
      const dstEntry = getEntry(dstDir);
      if (!entry || entry.type !== 'file') {
        setFlag(1, 0); updateRegs({ AX:'0002' });
        print('Source not found: ' + src, 'err'); return;
      }
      if (!dstEntry || dstEntry.type !== 'dir') {
        setFlag(1, 0); print('Destination dir not found: ' + dstDir, 'err'); return;
      }
      if (fs[dst]) {
        setFlag(1, 0); print('File already exists at destination: ' + dst, 'err'); return;
      }
      fs[dst] = { ...entry };
      delete fs[src];
      if (!dstEntry.children.includes(dst)) dstEntry.children.push(dst);
      Object.keys(fs).forEach(k => {
        if (fs[k].children) fs[k].children = fs[k].children.filter(c => c !== src);
      });
      updateRegs({ AX:'0056', CX: toHex(entry.size || 0) }); setFlag(0, 0);
      print('Moved ' + src + ' -> ' + dst, 'info');
    },

    /* 17. TREE — show directory tree */
    TREE: (args) => {
      const path  = resolvePath(args[0]);
      const entry = getEntry(path);
      printASM([
        '; TREE: recursive AH=4Eh/4Fh find first/next',
        'MOV AH, 4Eh  ; find first',
        'LEA DX, WILDCARD',
        'MOV CX, 0016h  ; attr mask',
        'INT 21h',
        '; loop with AH=4Fh find next',
        'MOV AH, 4Fh',
        'INT 21h'
      ]);
      if (!entry || entry.type !== 'dir') {
        setFlag(1, 0); print('Not a directory: ' + path, 'err'); return;
      }
      print(path, 'head');
      let count = 0;
      function printTree(dir, indent) {
        const e = getEntry(dir);
        if (!e || e.type !== 'dir') return;
        (e.children || []).forEach((child, i, arr) => {
          const ce   = getEntry(child);
          const name = child.split('\\').pop();
          const last = i === arr.length - 1;
          const pre  = indent + (last ? '└── ' : '├── ');
          if (ce && ce.type === 'dir') {
            print(pre + name + '/', 'out');
            printTree(child, indent + (last ? '    ' : '│   '));
          } else {
            print(pre + name, 'dim');
          }
          count++;
        });
      }
      printTree(path, '');
      updateRegs({ AX:'004E', CX: toHex(count) }); setFlag(0, count === 0 ? 1 : 0);
      print(count + ' item(s)', 'dim');
    },

    /* 18. CLS — clear screen */
    CLS: () => {
      printASM([
        '; AH=06h: Scroll Up (clear screen)',
        'MOV AH, 06h',
        'MOV AL, 00h  ; scroll all',
        'MOV BH, 07h  ; attr',
        'XOR CX, CX',
        'MOV DX, 184Fh',
        'INT 10h    ; BIOS video INT'
      ]);
      updateRegs({ AX:'0600', BX:'0700', CX:'0000', DX:'184F' }); setFlag(0, 1);
      screen.innerHTML = '';
      print('Screen cleared.', 'dim');
    },

    /* 19. PWD — print working directory */
    PWD: () => {
      printASM([
        '; AH=47h: Get Current Directory',
        'MOV AH, 47h',
        'MOV DL, 00h  ; current drive',
        'LEA SI, BUFFER',
        'INT 21h    ; SI -> path string (no drive)'
      ]);
      updateRegs({ AX:'0047', DX:'0000', SI: toHex(currentDir.length) }); setFlag(0, 0);
      print(currentDir, 'out');
    },

    /* 20. ECHO — print text to screen */
    ECHO: (args) => {
      const text = args.join(' ');
      printASM([
        '; AH=09h: Print String',
        'MOV AH, 09h',
        'LEA DX, MSG_STR  ; "$"-terminated string',
        'INT 21h'
      ]);
      updateRegs({ AX:'0009', DX: toHex(text.length) }); setFlag(0, text.length === 0 ? 1 : 0);
      print(text || 'ECHO is ON', 'out');
    },
  };

  /* ── Command Executor ── */
  function execute(raw) {
    if (!raw.trim()) return;
    history.unshift(raw);
    histIdx = -1;
    print('C:\\ASM> ' + raw, 'prompt');
    const parts = raw.trim().split(/\s+/);
    const cmd   = parts[0].toUpperCase();
    const args  = parts.slice(1);
    if (COMMANDS[cmd]) {
      try { COMMANDS[cmd](args); }
      catch (e) { print('Runtime error: ' + e.message, 'err'); }
    } else {
      printASM([
        '; Unknown command',
        'MOV AH, 09h',
        '; "Bad command or file name$"',
        'INT 21h'
      ]);
      setFlag(1, 0); updateRegs({ AX:'FFFF' });
      print('"' + cmd + '" is not recognized. Type HELP for the list.', 'err');
    }
  }

  /* ── Key Bindings ── */
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = input.value; input.value = ''; execute(v);
    }
    if (e.key === 'ArrowUp') {
      if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    }
    if (e.key === 'ArrowDown') {
      if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
      else { histIdx = -1; input.value = ''; }
    }
  });

  runBtn.addEventListener('click', () => {
    const v = input.value; input.value = ''; execute(v);
  });

  /* ── Boot Message ── */
  print('ASM FILE HANDLER v1.0  [x86 DOS Simulator]', 'head');
  print('Copyright (c) 2024 — Built with INT 21h syscalls', 'dim');
  print('Type HELP to see all 20 commands.', 'info');
  print('', 'out');
  printASM(['; Ready. Waiting for INT 21h...', 'MOV AH, 0Ah  ; buffered input', 'INT 21h']);
  input.focus();

})();
</script>
</body>
